[request_definition]
r = sub, obj, act, owner

[policy_definition]
p = sub, obj, act, eft

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = regexMatch(r.act, p.act) && keyMatch2(r.obj, p.obj) && ((p.sub == "owner" && r.sub == r.owner) || r.sub == p.sub || g(r.sub, p.sub))
